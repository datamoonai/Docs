paths:
  /plateFace:
    post:
      summary: Show new turn on board
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                turn:
                  type: integer
                  example: 123
                date:
                  example: 1402/02/02
                time:
                  example: 1
                last_turn:
                  example: 5
                name:
                  example: "mmd"
                national_id:
                  example: 4311598741
                phone_number:
                  example: 09199887402
                vehicle_type_str:
                  example: 1
                plate:
                  example: "22ta11111"
                queue_color:
                  example: "صف ۲ (قرمز)"

      responses:
        '200':
          description: Success status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  error_code:
                    example: -1
                    type: integer
                  error_message:
                    example: Camera is None
                    type: string
  /rest/api/get?plate={plate}:
    post:
      parameters:
        - in: path
          name: plate
          required: true
          example: 12B365-11
          schema:
            type: string
      responses:
        '200':
          description: Returns whether delete is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
