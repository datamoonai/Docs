  # parking
  /parking/printer_parking:
    post:
      tags:
        - Queuing System
      summary: Adds a new plate face log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file_img:
                  example: "data:image/png;base64,"
                title:
                  example: "پارکینگ قزوین"
                meta_data:
                  properties:
                    start_date:
                      example: "1400/10/09"
                    start_time:
                      example: "15:20:30"
                    end_date:
                      example: "1400/10/09"
                    end_time:
                      example: "15:20:30"
                    plate:
                      example: "14alef78922"
                    camera:
                      example: 1
                    parking_time:
                      example: 123456
                    price:
                      example: 2000




      responses:
        '200':
          description: print_plate
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true

  /parking/parking_log:

