    post:
      tags:
        - MembersSearch
        - Queuing System
      summary: This api is used to filter members
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: The page number, starting from 1
                  example: 1
                pageSize:
                  type: integer
                  description: Members page size (for example 10 item per page)
                  example: 10
                name:
                  type: string
                  example: null
                  description: Not used
                family:
                  type: string
                  example: null
                  description: Not used
                maxDistance:
                  type: number
                  example:
                    1.0545454545454547
                  description: In face app only. When searching member image with image
                startDate:
                  type: number
                  description: In face app only and when passStatus is filtered. A timestamp in milli seconds
                  example: 1670617800000
                endDate:
                  type: number
                  description: In face app only and when passStatus is filtered. A timestamp in milli seconds
                  example: 1670704199000
                melli_code:
                  type: string
                  description: Unique code for each member, if set melli_code = "" we ignore it
                  example: ""
                is_defined:
                  type: string
                  description: In face app only. It can take three values, 'yes' and 'no' or 'all' string. If it is 'yes' so the member should have at least one image for recognition and if 'no' the person should have no image for recognition
                  example: "all"
                has_profile_image:
                  type: string
                  description: It can take three values, 'yes' and 'no' or 'all' string.
                  example: "all"
                plate:
                  type: string
                  description: In plate app only. It can be null or empty to ignore it.
                  example: ""
                member_id:
                  type: integer
                  description: Unique member id in database. It can be null or -1
                  example: -1
                vector:
                  type: array
                  items:
                    type: number
                  description: In face app only. Used to search members with their images.
                  example: null
                search_picture_count:
                  type: boolean
                  description: In face app only. If true we will search number of images
                  example: false
                min_picture_count:
                  type: integer
                  description: In face app only
                  example: 0
                max_picture_count:
                  type: integer
                  description: In face app only
                  example: 1000
                passStatus:
                  type: integer
                  description: In face app only. If it is -1 or null we will ignore it. 0 presented, 1 absent, 2 has any pass log and 3 has not pass log
                  example: -1
                is_employee:
                  example: "0"


      responses:
        '400':
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: false
                    description: whether password change is successful or not
                  message:
                    type: string
                    example: current password incorrect
        '500':
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: false
                    description: whether password change is successful or not
