  #gas station
  /gasStation/:
    post:
      tags:
        - gasStation
        - Queuing System
      summary: Returns a list of plate logs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commonSearchParams:
                  type: object
                  properties:
                    startDate:
                      type: integer
                      description: epoch time milli seconds
                      example: 1
                    endDate:
                      type: integer
                      description: epoch time milli seconds
                      example: 18171740999000
                    minCount:
                      type: integer
                      description: count plate
                      example: 1
                    maxCount:
                      type: integer
                      description: count plate
                      example: 1000000000
                    all_camera_ids:
                      type: array
                      example:
                        [1]
                      items:
                        type: integer
                      description: Means user camera list
                    cameraId:
                      type: integer
                      example: -1
                      deprecated: true
                      description: if -1 search all cameras
                    camera_ids:
                      type: array
                      example: [1]
                      items:
                        type: integer
                    permission:
                      example: 0
                      type: integer
                    order:
                      type: integer
                      example: 1
                page:
                  type: integer
                  description: 1 max- 2 min- default 1
                  example: 1
                pageSize:
                  type: integer
                  example: 10
      responses:
        '200':
          description: A List Gas Station
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: boolean
                    example: true
                  groups:
                    type: array
  /gasStation/chart_order_day:
    post:
      tags:
