      tags:
        - Queuing System
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                pageSize:
                  type: integer
                  example: 1
                params:
                  type: object
                  properties:
                    search_plate_id:
                      type: integer
                      example: -1
                      description: ID of the user for plate
                    vehicle_types:
                      type: array
                      description: List of vehicles to search [], null, [1], [0], [0, 1]
                      example: [ ]
                      items:
                        type: integer
                    search_face_id:
                      type: integer
                      example: -1
                      description: ID of the user for face
                    plate:
                      type: string
                      example: null
                      description: Example 12q12355
                    start_date:
                      type: integer
                      example: 1
                    end_date:
                      type: integer
                      example: 2000000000000
                    register_start_date:
                      type: integer
                      example: 1
                    register_end_date:
                      type: integer
                      example: 2000000000000
                    enter_start_date:
                      type: integer
                      example: 1
                    enter_end_date:
                      type: integer
                      example: 2000000000000
                    exit_start_date:
                      type: integer
                      example: 1
                    exit_end_date:
                      type: integer
                      example: 2000000000000
                    turn_statuses:
                      type: array
                      example: [ ]
                      description: 0 -> only registered, 1-> entered, 2-> completed. Accepted list values null [] [0] [1] [2]
                    entrance_statuses:
                      type: array
                      example: [ ]
                      description: 0 -> queue == current, 1-> queue != current. Accepted list values null [] [0] [1]
                    log_type:
                      type: integer
                      example:
                        0
                      description: can be 0 -> queuing system and 1 -> enter and exit
      responses:
        '200':
          description: Success status
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlateFaceLog'
                  count:
                    type: integer
                    example: 1
