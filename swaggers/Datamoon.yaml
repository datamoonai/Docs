  # users
  /users/meta_data:
    post:
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                meta_data:
                  type: object
                  description: The unique code for user
                  example: {
                             theme : "blue",
                             mode : "dark"
                  }

      summary: user metadata
      responses:
        '200':
          description: metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
                  meta_data:
                    type: object



    get:
      tags:
        - Users
      summary: Returns user metadata
      responses:
        '200':
          description: metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
                  meta_data:
                    type: object

  /users/auth:
    post:
      tags:
        - Authentication
      summary: Returns a bearer token.
      description: Login and get an authorization token.
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  example: "admin@123"
      responses:
        '500':
          description: Internal server error.
        '400':
          description: Invalid credentials.
        '200':
          description: Successful login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
                    description: test
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                        example: admin
                        description: The username that is logged in
                      name:
                        type: string
                        example: Mahdi Mohammadpour
                        description: The name of the user
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjMsImlhdCI6MTY3MDM5OTM2MSwiZXhwIjo0ODIzOTk5MzYxfQ.V2akVWnXICifomVobiJJj6nWlsgg7-kmu9asInUoEcA
                        description: The bearer token for API authentication
  /users/acl:
    get:
      tags:
        - ACL
      summary: Returns Access-control List and cameras of the users
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of acl and cameras
          content:
            application/json:
              schema:
                type: object
                properties:
                  acl:
                    type: array
                    description: id of acl
                    example: [ 23, 24 ]
                    enum:
                      - 1: View
                      - 2: Edit
                    items:
                      type: integer
                  cameras:
                    type: array
                    description: id of cameras
                    example: [ 1, 2 ]
                    items:
                      type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /users/acls:
    get:
      tags:
        - ACL
      summary: Returns Access-control List names
      responses:
        '200':
          description: List of ACLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ACL:
                    type: array
                    items:
                      $ref: '#/components/schemas/ACL'
                  ACL_NAMES:
                    type: object
                    example: { LIVE: LIVE, REPORT: REPORT }
                    items:
                      type: object
                      description: list of ACLs for example LIVE, REPORT, MEMBER,...
                  ACL_ACTIONS:
                    type: object
                    example: { VIEW: VIEW, EDIT: EDIT, ADD: ADD, DELETE: DELETE }
                    items:
                      type: object
                      description: total four types of actions
  /users/:
    get:
      tags:
        - Users
      summary: Returns list of users
      responses:
        '200':
          description: List of USERS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Creates a new user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    password:
                      type: string
                    name:
                      type: string
                      example: Mahdi Mohammadpour
                    acl:
                      type: array
                      items:
                        type: integer
                      example: [ 12, 15 ]
                      description: list of user's acl ids
                    cameras:
                      type: array
                      items:
                        type: integer
                      example: [ 14, 16 ]
                      description: List of cameras that user has access to them
      responses:
        '200':
          description: List of USERS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    put:
      tags:
        - Users
      summary: Updates the user info
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: id of the user
                      example: 7
                    name:
                      type: string
                    username:
                      type: string
                    password:
                      type: string
                      minLength: 6
                      description: if empty or null does not effect
                      example: null
                    acl:
                      type: array
                      items:
                        type: integer
                      example: [ 12, 15 ]
                      description: list of user's acl ids
                    cameras:
                      type: array
                      items:
                        type: integer
                      example: [ 14, 16 ]
                      description: List of cameras that user has access to them
      responses:
        '200':
          description: returns result, whether update is successful or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
    delete:
      tags:
        - Users
      summary: Delete a user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: id of the user
      responses:
        '200':
          description: returns result, whether delete is successful or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
