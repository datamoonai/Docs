components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
  schemas:
    ACL:
      type: object
      properties:
        name:
          type: string
          example: LIVE
        id:
          type: integer
          example: 11
        desc:
          type: string
          description: Description of the acl
          example: Live Video
    User:
      type: object
      properties:
        id:
          type: integer
          example: 2
        username:
          type: string
          example: admin
        name:
          type: string
          example: Mahdi Mohammadpour
        acl:
          type: array
          items:
            type: integer
          description: The list of user access-control
          example: [ 11, 14, 16 ]
        cameras:
          type: array
          items:
            type: integer
          example: [ 11, 12 ]
          description: The list of cameras that user has access to them
        created_date:
          type: string
          example: 2021-10-12T05:24:59.609Z
    Member:
      type: object
      properties:
        full_count:
          type: string
          example: 22
          description: It is total number of members
        id:
          type: integer
          example: 36
          description: It is id of the member in database
        first_name:
          type: string
          example: Mahdi,
        last_name:
          type: string
          example: Mohammadpour
        melli_code:
          type: string
          description: A Unique id for each user.
          example: 456
        personnel_code:
          type: string
          description: Another unique code for each user
          example: null
        group_id:
          type: integer
          description: Not used
          example: null
        permission_id:
          type: integer
          description: The id of the permission you have assigned to the user
          example: 1
        is_active:
          type: boolean
          example: true
          description: Not used
        is_deleted:
          type: boolean
          example: null
          description: Not used
        created_date:
          type: string
          example: 2022-12-03T11:22:04.485Z
        modified_date:
          type: string
          example: null
          description: Not used
        default_image_id:
          type: integer
          example: 91
          description: The id of the model (vectors) that is default image for person. this is used to find similar images to default image of that person
        plate:
          type: string
          description: Not used
          example: null
        company_name:
          type: string
          example: null
        "phone_number":
          type: string
          example: null
        plate_capacity:
          type: integer
          description: In plate app only. Indicating number of parking capacity for that member
          example: 1000
        meta_data:
          type: object
          example: "{\"rfid_code\":\"\",\"open_gate\":true,\"has_authority\":false,\"is_male\":false,\"is_dormitory\":false,\"is_active\":false,\"has_all_authority\":false,\"yas_person_id\":\"\"}"
          description: Other options for the member
          properties:
            rfid_code:
              type: string
              example:
                null
            open_gate:
              type: boolean
              example: true
            has_authority:
              type: boolean
              example: true
            is_male:
              type: boolean
              example: true
            is_dormitory:
              type: boolean
              example: true
            is_active:
              type: boolean
              example:
                true
            has_all_authority:
              type: boolean
              example: true
            yas_person_id:
              type: string
              example:
                123
        station_id:
          type: integer
          description: In distributed clients indicates the member is for which station
          example: null
        file_name:
          type: string
          description: File name of the default member image
          example:
            "28022_20221215_112853.jpg"
    PermissionItem:
      type: object
      properties:
        day:
          type: integer
          example: 0
        hour:
          type: integer
          example: 0
        cameras:
          type: array
          example: [ 1, 2 ]
          items:
            type: integer
    Permission:
      type: object
      properties:
        start_date:
          type: string
          example: 2021-09-01T20:19:01.112Z
        end_date:
          type: string
          example: 2021-09-01T20:19:01.112Z
        id:
          type: integer
          example: 1
        name:
          type: string
          example: New Members Permission
        type:
          type: integer
          description: 0 is permanent, 1 is daily and 2 is hourly
          example: 0
        permission:
          type: array
          description: This array has 168 (24hours * 7days) items when type is 0 and 1
          items:
            $ref: '#/components/schemas/PermissionItem'
        meta_data:
          type: object
          properties:
            parking:
              type: object
              properties:
                cost_per_hour:
                  type: integer
                  example:
                    1000
    Plate:
      type: object
      properties:
        id:
          type: integer
          example: 1
        member_id:
          type: integer
          example: 1
        plate:
          type: string
          example: "42ta54764"
        status:
          type: integer
          example: 0
          description: 0 outside, 1 inside
    Camera:
      type: object
      properties:
        app:
          type: integer
          example: 1
          description: 1 Face, 2 Plate
        id:
          type: integer
          example: 1
          description: Camera id in database
        is_enabled:
          type: boolean
          example: true
        is_inside:
          type: boolean
          example: true
          description: true if the camera is recording incoming transmissions
        name:
          type: string
          example:
            Camera number 1
